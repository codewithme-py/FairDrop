volumes:
  fairdrop-postgres:
  fairdrop-redis:
  fairdrop-s3:
  fairdrop-app:
  fairdrop-gateway:
  fairdrop-prometheus:
  fairdrop-grafana:

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${DB_HOST}
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', '${POSTGRES_DB}', '-U', '${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file: .env
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - fairdrop-postgres:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: ${REDIS_HOST}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file: .env
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - fairdrop-redis:/data
      
  s3:
    image: minio/minio:latest
    container_name: ${S3_HOST}
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file: .env
    ports:
      - '${S3_PORT}:9000'
    volumes:
      - fairdrop-s3:/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - '${APP_PORT}:8000'
    volumes:
      - fairdrop-app:/data
      
  gateway:
    image: nginx:alpine
    container_name: ${GATEWAY_HOST}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${GATEWAY_PORT}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_fairdrop
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - fairdrop-prometheus:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_fairdrop
    ports:
      - '3000:3000'
    volumes:
      - fairdrop-grafana:/var/lib/grafana
    depends_on:
      - prometheus
